<script>
(function(){
'use strict';

// ==================== 核心配置（runjiaxcl 分类） ====================
const BASE = 'https://www.runjiaxcl.com';
const CATS = [
  ['首页','/'],
  ['国产剧','/list/13-----------.html'],
  ['电影','/list/1-----------.html'],
  ['短剧','/type/5.html'],
  ['动漫','/list/4-----------.html'],
  ['综艺','/list/3-----------.html'],
  ['🔥热播','/label/qq/']
];
const UA = 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36';
let fmReady = false;
let currentUrl = BASE + '/';
let lastFocus = null;
let pageState = { url: '', page: 1 };
let lastHtmlContent = '';

const $ = s => document.querySelector(s);
const content = $('#content');
const statusEl = $('#status');
const tabsDiv = $('#tabs');
const pager = $('#pager');

// ==================== SDK 检测 ====================
function markNative() {
  if (window.fongmiBridge || window.fm || window.fongmi) 
    document.documentElement.classList.add('fm-native');
}
function waitFm(ms = 1600) {
  markNative();
  if (window.fm) {
    fmReady = true;
    return Promise.resolve(window.fm);
  }
  return new Promise(resolve => {
    let done = false;
    const ok = () => {
      if (done) return;
      done = true;
      markNative();
      fmReady = !!window.fm;
      resolve(window.fm || null);
    };
    window.addEventListener('fmsdk', ok, { once: true });
    setTimeout(ok, ms);
  });
}

// ==================== 工具函数 ====================
function abs(url) {
  if (!url) return '';
  try { return new URL(url, BASE + '/').href; } catch(e) { return url; }
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/[&<>'"]/g, c => {
    if (c === '&') return '&amp;';
    if (c === '<') return '&lt;';
    if (c === '>') return '&gt;';
    if (c === "'") return '&#39;';
    if (c === '"') return '&quot;';
    return c;
  });
}
function clean(s) {
  return String(s || '').replace(/\s+/g, ' ').replace(/[\uE000-\uF8FF]/g, '').trim();
}

// 修复图片URL：处理 &amp;、//、无协议域名，过滤 base64
function fixPic(u) {
  if (!u) return '';
  let fixed = u.replace(/&amp;/g, '&');
  if (fixed.startsWith('//')) {
    fixed = 'https:' + fixed;
  }
  if (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}\//.test(fixed)) {
    fixed = 'https://' + fixed;
  }
  if (fixed.startsWith('data:image')) return '';
  return fixed;
}

function imgUrl(u) {
  u = abs(u);
  if (!u) return '';
  const fixed = fixPic(u);
  if (!fixed) return '';
  try {
    if (window.fm && fm.res) return fm.res(fixed, { headers: { Referer: BASE + '/' } });
  } catch(e) {}
  return fixed;
}

// ==================== 双保险请求函数 ====================
async function reqText(url, options = {}) {
  url = abs(url);
  statusEl.textContent = '加载：' + url;
  const maxRetries = 2;
  let lastError;
  for (let i = 0; i <= maxRetries; i++) {
    try {
      if (window.fm && typeof fm.req === 'function') {
        const resp = await fm.req(url, {
          method: options.method || 'GET',
          headers: Object.assign({ 'User-Agent': UA, 'Referer': BASE + '/' }, options.headers || {}),
          responseType: 'text',
          timeout: options.timeout || 25,
          credentials: 'include',
          body: options.body,
          signal: options.signal // 支持 AbortSignal
        });
        const isOk = resp.ok !== undefined ? resp.ok : (resp.status >= 200 && resp.status < 300);
        if (!isOk && resp.status !== 200)
          throw new Error(resp.error || ('HTTP ' + resp.status));
        return resp.body || resp.content || resp.data || resp.text || '';
      }
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), (options.timeout || 25) * 1000);
      const fetchOpts = {
        headers: Object.assign({ 'Referer': BASE + '/' }, options.headers || {}),
        signal: options.signal || controller.signal
      };
      if (options.method === 'POST') {
        fetchOpts.method = 'POST';
        fetchOpts.body = options.body;
      }
      const r = await fetch(url, fetchOpts);
      clearTimeout(timeoutId);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    } catch(e) {
      lastError = e;
      if (i < maxRetries) await new Promise(resolve => setTimeout(resolve, 1000));
    }
  }
  statusEl.textContent = '加载失败：' + (lastError ? lastError.message : '未知错误');
  throw lastError || new Error('请求失败');
}

// ==================== 解密函数（至臻4K破解） ====================
function md5(str) { return CryptoJS.MD5(str).toString(); }
function fixB64(s) { if (!s) return s; let missing = s.length % 4; if (missing) s += '='.repeat(4 - missing); return s; }
function jsDecrypt1(data) {
  try {
    data = fixB64(data);
    const key = md5('test');
    const decoded = atob(data);
    let result = '';
    for (let i = 0; i < decoded.length; i++) {
      result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return atob(result);
  } catch(e) { return data; }
}
function jsDecrypt2(data) {
  const staticchars = "PXhw7UT1B0a9kQDKZsjIASmOezxYG4CHo5Jyfg2b8FLpEvRr3WtVnlqMidu6cN";
  try {
    data = fixB64(data);
    const dec = atob(data);
    let out = '';
    for (let i = 1; i < dec.length; i += 3) {
      const ch = dec[i];
      const idx = staticchars.indexOf(ch);
      if (idx !== -1) out += staticchars[(idx + 59) % 62];
      else out += ch;
    }
    return out;
  } catch(e) { return data; }
}
function jsDecrypt3(data) {
  try {
    const parts = data.split('/');
    if (parts.length >= 3) {
      const arr1 = JSON.parse(atob(fixB64(parts[0])));
      const arr2 = JSON.parse(atob(fixB64(parts[1])));
      const cipher = atob(fixB64(parts.slice(2).join('/')));
      let result = '';
      for (let i = 0; i < cipher.length; i++) {
        const c = cipher[i];
        const idx = arr2.indexOf(c);
        if (idx !== -1) result += arr1[idx];
        else result += c;
      }
      return result;
    }
  } catch(e) {}
  return data;
}

async function crackPlayUrl(playPageUrl) {
  try {
    let html = await reqText(playPageUrl);
    let match = html.match(/var\s+player_aaaa\s*=\s*(\{[\s\S]*?\})\s*<\/script>/);
    if (!match) return null;
    let playerData;
    try { playerData = JSON.parse(match[1]); } catch(e) { return null; }
    let durl = playerData.url || '';
    let encrypt = playerData.encrypt || 0;
    if (encrypt == 1) durl = decodeURIComponent(durl);
    else if (encrypt == 2) durl = decodeURIComponent(atob(durl));
    if (durl.startsWith('http') && (durl.includes('.m3u8') || durl.includes('.mp4'))) return durl;
    let configUrl = BASE + '/static/js/playerconfig.js';
    let configJs = await reqText(configUrl);
    let parseApi = '';
    let fromFlag = playerData.from || '';
    if (fromFlag) {
      let re = new RegExp('"' + fromFlag + '":\\{[^}]*"parse":"([^"]+)"');
      let m = configJs.match(re);
      if (m) parseApi = m[1].replace(/\\\//g, '/');
    }
    if (!parseApi) {
      let m = configJs.match(/"parse":"(http[^"]+)"/);
      if (m) parseApi = m[1].replace(/\\\//g, '/');
    }
    if (!parseApi) parseApi = 'https://fgsrg.hzqingshan.com/player/?url=';
    let iframeUrl = parseApi + encodeURIComponent(durl);
    let iframeHtml = await reqText(iframeUrl, { headers: { Referer: playPageUrl } });
    let tempDiv = document.createElement('div');
    tempDiv.innerHTML = iframeHtml;
    let playerDataEl = tempDiv.querySelector('#player-data');
    if (!playerDataEl) return iframeUrl;
    let token = playerDataEl.getAttribute('data-te') || '';
    let bt = playerDataEl.getAttribute('data-bt') || '/player/';
    let apiBase = new URL(parseApi);
    let apiHost = apiBase.origin;
    let apiUrl = apiHost + bt + 'mplayer.php';
    let postData = 'url=' + encodeURIComponent(durl) + '&token=' + encodeURIComponent(token);
    let apiResText = await reqText(apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
        'X-Requested-With': 'XMLHttpRequest',
        'Referer': iframeUrl,
        'Origin': apiHost
      },
      body: postData
    });
    let apiJson;
    try { apiJson = JSON.parse(apiResText); } catch(err) { return null; }
    let realUrl = apiJson.url || (apiJson.data && apiJson.data.url) || '';
    let urlmode = String(apiJson.urlmode || (apiJson.data && apiJson.data.urlmode) || '');
    if (urlmode === '1') realUrl = jsDecrypt1(realUrl);
    else if (urlmode === '2') realUrl = jsDecrypt2(realUrl);
    else if (urlmode === '3') realUrl = jsDecrypt3(realUrl);
    for (let i = 0; i < 3; i++) {
      if (realUrl.startsWith('WyJ') && realUrl.includes('/')) realUrl = jsDecrypt3(realUrl);
      else break;
    }
    if (realUrl && (realUrl.includes('.m3u8') || realUrl.includes('.mp4'))) return realUrl;
    return null;
  } catch(e) { console.error('破解失败', e); return null; }
}

async function fetchRealPlayUrl(playPageUrl) {
  try {
    let html = await reqText(playPageUrl);
    let videoMatch = html.match(/<video[^>]+src="([^"]+)"/i);
    if (videoMatch) return videoMatch[1];
    let iframeMatch = html.match(/<iframe[^>]+src="([^"]+)"/i);
    if (iframeMatch) return iframeMatch[1];
    let m3u8Match = html.match(/https?:\/\/[^\s"'<>]+\.m3u8[^\s"'<>]*/i);
    if (m3u8Match) return m3u8Match[0];
    let mp4Match = html.match(/https?:\/\/[^\s"'<>]+\.mp4[^\s"'<>]*/i);
    if (mp4Match) return mp4Match[0];
    return null;
  } catch(e) { return null; }
}

// ==================== 图片提取 ====================
function parseList(html, keyword = '') {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const itemMap = new Map();

  const containers = doc.querySelectorAll(
    '.vlist .item, .list .item, .vod-list .item, .module-item, ' +
    '.col-xs-4, .col-sm-3, .col-md-2, .col-lg-2, ' +
    '.grid .item, .row .item, .list-item, .video-item, ' +
    '.stui-vodlist__item, .hl-list-item, .fed-list-item, ' +
    '.myui-vodlist__box, .module-item-cover, ' +
    '.public-list, .public-list-exp, .vod-item, .li-hover, ' +
    'ul.row li, .vod-list ul.row li, ' +
    '.vlist ul.row li, .type-list ul.row li'
  );
  console.log('[解析] 找到 ' + containers.length + ' 个潜在容器');

  if (containers.length) {
    containers.forEach(el => {
      let a = el.querySelector('a[href*="/detail/"]');
      if (!a) {
        if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href').includes('/detail/')) {
          a = el;
        } else {
          return;
        }
      }
      const href = abs(a.getAttribute('href'));
      if (itemMap.has(href)) return;
      
      let title = clean(a.getAttribute('title') || a.textContent);
      if (!title || title.length < 2) {
        const nameA = el.querySelector('.name h3 a');
        if (nameA) title = clean(nameA.getAttribute('title') || nameA.textContent);
      }
      if (!title || title.length < 2) return;
      if (keyword && !title.includes(keyword)) return;

      let image = '';
      
      const img = el.querySelector('img');
      if (img) {
        const src = img.getAttribute('data-src') || 
                    img.getAttribute('data-original') || 
                    img.getAttribute('data-lazy-src');
        if (src) {
          image = fixPic(src);
        } else {
          const rawSrc = img.getAttribute('src') || '';
          if (rawSrc && !rawSrc.startsWith('data:') && 
              !rawSrc.includes('blank') && !rawSrc.includes('pixel') && 
              !rawSrc.includes('transparent') && !rawSrc.includes('empty.gif')) {
            image = fixPic(rawSrc);
          }
        }
      }

      if (!image) {
        const picDiv = el.querySelector('.img-wrapper-pic, .img-wrapper, .pic, .poster, .cover, .lazy, .vodlist_thumb');
        if (picDiv) {
          const bg = picDiv.getAttribute('data-background-image') || '';
          if (bg) {
            image = fixPic(bg);
          }
          if (!image) {
            const ds = picDiv.getAttribute('data-src') || '';
            if (ds) {
              image = fixPic(ds);
            }
          }
          if (!image) {
            const style = picDiv.getAttribute('style') || '';
            const match = style.match(/background-image:\s*url\(["']?(.*?)["']?\)/i);
            if (match) {
              const raw = match[1];
              if (raw && !raw.startsWith('data:') && !raw.includes('blank')) {
                image = fixPic(raw);
              }
            }
          }
        }
      }

      if (!image && a) {
        const style = a.getAttribute('style') || '';
        const match = style.match(/background-image:\s*url\(["']?(.*?)["']?\)/i);
        if (match) {
          const raw = match[1];
          if (raw && !raw.startsWith('data:') && !raw.includes('blank')) {
            image = fixPic(raw);
          }
        }
      }
      if (!image) {
        const parent = el.closest('li, div, .item');
        if (parent) {
          const style = parent.getAttribute('style') || '';
          const match = style.match(/background-image:\s*url\(["']?(.*?)["']?\)/i);
          if (match) {
            const raw = match[1];
            if (raw && !raw.startsWith('data:') && !raw.includes('blank')) {
              image = fixPic(raw);
            }
          }
        }
      }
      
      image = abs(image);

      let remark = '';
      const remarkNode = el.querySelector('.remark, .note, .sub, .info, .tag, .score, .ep, .updata, .ft2, .public-list-prb');
      if (remarkNode) remark = clean(remarkNode.textContent);

      // ★ 提取数字 ID 用于精准匹配
      let id = '';
      const idMatch = href.match(/\/detail\/(\d+)\.html/);
      if (idMatch) id = idMatch[1];

      itemMap.set(href, { href, id, title, remark: remark.slice(0, 30), image });
    });
  }

  // 兜底暴力扫描
  if (itemMap.size === 0) {
    console.warn('[解析] 常规容器未命中，启动暴力扫描所有 /detail/ 链接');
    const allLinks = doc.querySelectorAll('a[href*="/detail/"]');
    allLinks.forEach(a => {
      const href = abs(a.getAttribute('href'));
      if (itemMap.has(href)) return;
      let title = clean(a.getAttribute('title') || a.textContent);
      if (!title || title.length < 2) {
        const img = a.querySelector('img');
        if (img) title = clean(img.getAttribute('alt') || img.getAttribute('title'));
      }
      if (!title || title.length < 2) return;
      if (keyword && !title.includes(keyword)) return;

      let image = '';
      const imgEl = a.querySelector('img');
      if (imgEl) {
        const src = imgEl.getAttribute('data-src') || imgEl.getAttribute('data-original') || imgEl.getAttribute('data-lazy-src');
        if (src) {
          image = fixPic(src);
        } else {
          const rawSrc = imgEl.getAttribute('src') || '';
          if (rawSrc && !rawSrc.startsWith('data:') && !rawSrc.includes('blank') && !rawSrc.includes('pixel')) {
            image = fixPic(rawSrc);
          }
        }
      }
      
      if (!image) {
        const parent = a.closest('li, div, .item, .col-xs-4, .col-sm-3, .col-md-2, .module-item, .public-list');
        if (parent) {
          const picDiv = parent.querySelector('.img-wrapper-pic, .img-wrapper, .pic, .poster, .cover, .lazy, .vodlist_thumb');
          if (picDiv) {
            const bg = picDiv.getAttribute('data-background-image') || '';
            if (bg) image = fixPic(bg);
            if (!image) {
              const ds = picDiv.getAttribute('data-src') || '';
              if (ds) image = fixPic(ds);
            }
            if (!image) {
              const style = picDiv.getAttribute('style') || '';
              const match = style.match(/background-image:\s*url\(["']?(.*?)["']?\)/i);
              if (match) {
                const raw = match[1];
                if (raw && !raw.startsWith('data:') && !raw.includes('blank')) image = fixPic(raw);
              }
            }
          }
          if (!image) {
            const pImg = parent.querySelector('img');
            if (pImg) {
              const src = pImg.getAttribute('data-src') || pImg.getAttribute('data-original') || pImg.getAttribute('src') || '';
              if (src && !src.startsWith('data:') && !src.includes('blank')) {
                image = fixPic(src);
              }
            }
          }
        }
      }
      
      image = abs(image);

      let remark = '';
      const parent = a.closest('li, div, .item, .col-xs-4, .col-sm-3, .col-md-2, .module-item, .public-list');
      if (parent) {
        const rn = parent.querySelector('.remark, .note, .sub, .info, .tag, .score, .ep, .updata, .ft2, .public-list-prb');
        if (rn) remark = clean(rn.textContent);
      }

      let id = '';
      const idMatch = href.match(/\/detail\/(\d+)\.html/);
      if (idMatch) id = idMatch[1];

      itemMap.set(href, { href, id, title, remark: remark.slice(0, 30), image });
    });
  }

  const items = Array.from(itemMap.values());
  const withImage = items.filter(it => it.image).length;
  console.log('[解析] 最终解析到 ' + items.length + ' 个影片，其中 ' + withImage + ' 个有图片');
  return items.length ? [{ title: keyword ? '搜索：' + keyword : '影片列表', items }] : [];
}

// ==================== 详情解析（不变） ====================
function parseDetail(html, url) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let h1 = doc.querySelector('h1');
  let title = h1 ? clean(h1.textContent) : clean(doc.title.replace(/《|》|免费观看.*$/, ''));
  let pic = doc.querySelector('.detail-pic img, .vod-pic img, .poster img, .cover img, img[alt*="海报"], .lazyload, .pic img');
  let image = pic ? fixPic(pic.getAttribute('data-src') || pic.getAttribute('data-original') || pic.getAttribute('src') || '') : '';
  image = abs(image);
  let descElem = doc.querySelector('.desc, .info, .abstract, .vod-content, .detail-content, .introduction, .summary');
  let desc = descElem ? clean(descElem.textContent) : '';
  if (!desc) {
    let bodyText = doc.body.innerText;
    let match = bodyText.match(/简介[：:]\s*([\s\S]*?)(?:播放|线路|演员|导演|$)/i);
    if (match) desc = clean(match[1]);
  }
  if (!desc) desc = '暂无简介';
  if (desc.length > 360) desc = desc.slice(0, 360) + '…';
  let infoLines = [];
  const infoMap = { '类型': '', '导演': '', '演员': '', '年代': '', '地区': '', '更新': '' };
  let infoEl = doc.querySelector('.info, .detail-info, .vod-info, .info-list, .meta');
  if (infoEl) {
    let text = infoEl.innerText;
    for (let key of Object.keys(infoMap)) {
      let reg = new RegExp(key + '[：:]\\s*([^\\n\\r]+)', 'i');
      let match = text.match(reg);
      if (match) infoMap[key] = clean(match[1]);
    }
  }
  for (let [k, v] of Object.entries(infoMap)) if (v) infoLines.push([k, v]);
  let lines = [];
  let tabDivs = doc.querySelectorAll('.anthology-tab, .module-tab, .play-tab, .tab-list, .tabs');
  let listDivs = doc.querySelectorAll('.anthology-list-box, .play-list, .module-list, .episode-list, .list-box');
  if (tabDivs.length && listDivs.length) {
    let tabs = Array.from(tabDivs[0].querySelectorAll('a, span, .tab'));
    let lists = Array.from(listDivs);
    for (let i = 0; i < tabs.length && i < lists.length; i++) {
      let name = clean(tabs[i].textContent).replace(/\(\d+\)/, '');
      let eps = [];
      let epLinks = lists[i].querySelectorAll('a[href*="/play/"]');
      for (let a of epLinks) {
        let href = abs(a.getAttribute('href'));
        let epTitle = clean(a.textContent) || '播放';
        eps.push({ href, title: epTitle });
      }
      if (eps.length) lines.push({ sid: String(i + 1), name: name || ('线路' + (i + 1)), eps });
    }
  }
  if (lines.length === 0) {
    let allPlayLinks = doc.querySelectorAll('a[href*="/play/"]');
    let groups = new Map();
    for (let a of allPlayLinks) {
      let href = abs(a.getAttribute('href'));
      let match = href.match(/\/play\/(\d+)-(\d+)-(\d+)\.html/);
      let sid = '1';
      if (match) sid = match[2];
      if (!groups.has(sid)) groups.set(sid, []);
      groups.get(sid).push({ href, title: clean(a.textContent) || '第' + (groups.get(sid).length + 1) + '集' });
    }
    let idx = 1;
    for (let [sid, eps] of groups.entries()) {
      lines.push({ sid: String(sid), name: '线路' + idx, eps });
      idx++;
    }
  }
  for (let line of lines) {
    line.eps.sort((a, b) => {
      const numA = parseInt(a.title.match(/\d+/)?.[0] || 0, 10);
      const numB = parseInt(b.title.match(/\d+/)?.[0] || 0, 10);
      return numA - numB;
    });
  }
  return { title, image: abs(image), fields: infoLines, desc, lines, url };
}

// ==================== 渲染函数 ====================
function renderTabs(activeUrl) {
  tabsDiv.innerHTML = CATS.map(([name, path]) => {
    let url = abs(path);
    let active = (url === activeUrl) ? 'active' : '';
    return '<button class="tab focusable ' + active + '" data-url="' + esc(url) + '">' + esc(name) + '</button>';
  }).join('');
  Array.from(tabsDiv.querySelectorAll('.tab')).forEach(btn => btn.onclick = () => loadPage(btn.dataset.url));
}

function renderSections(sections) {
  if (!sections || !sections.length) {
    content.innerHTML = '<div class="empty">暂无内容<br><span class="hint">可能该分类暂无数据或解析失败，可尝试刷新</span></div>';
    pager.style.display = 'none';
    return;
  }
  content.innerHTML = sections.map(sec => {
    if (!sec.items || !sec.items.length) return '';
    return '<section class="section">' +
      '<div class="section-title"><h2>' + esc(sec.title) + '</h2></div>' +
      '<div class="grid">' +
      sec.items.map(it =>
        '<article class="card focusable" tabindex="0" data-href="' + esc(it.href) + '" data-id="' + esc(it.id) + '">' +
        '<div class="poster">' +
        (it.image ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(imgUrl(it.image)) + '" alt="' + esc(it.title) + '" onerror="this.dataset.failed=\'true\'; this.style.display=\'none\'; this.parentNode.querySelector(\'.noimg\')?.style?.display=\'flex\';">' : '<div class="noimg">枫</div>') +
        '</div>' +
        '<div class="meta">' +
        '<div class="name">' + esc(it.title) + '</div>' +
        '<div class="remark">' + esc(it.remark || '点击查看详情') + '</div>' +
        '</div>' +
        '</article>'
      ).join('') +
      '</div>' +
      '</section>';
  }).filter(Boolean).join('');
  Array.from(content.querySelectorAll('.card')).forEach(card => card.onclick = () => openDetail(card.dataset.href));
  const total = sections.reduce((s, sec) => s + (sec.items ? sec.items.length : 0), 0);
  renderPager(total);
  statusEl.textContent = '已加载 ' + total + ' 条内容';

  // ★ 增加补图机会：首次500ms后，再于2500ms后二次补图（覆盖加载慢或失败的）
  setTimeout(enrichListImages, 500);
  setTimeout(enrichListImages, 2500);
}

// ==================== ★★★ 增强版补图（支持重试、取消、从data-href取id） ★★★ ====================
let enrichingSet = new Set();
let enrichAbortController = null;

function enrichListImages() {
  // 取消之前的补图任务
  if (enrichAbortController) {
    enrichAbortController.abort();
    enrichAbortController = null;
  }
  enrichAbortController = new AbortController();
  const signal = enrichAbortController.signal;

  const cards = document.querySelectorAll('.card:not(.enriched)');
  const targetCards = Array.from(cards).filter(card => {
    const img = card.querySelector('.poster img');
    if (!img) return true;
    const src = img.getAttribute('src');
    if (!src || src === '' || src.includes('noimg')) return true;
    if (img.dataset.failed === 'true') return true;
    return false;
  });
  if (targetCards.length === 0) return;
  console.log('[补图] 需补图卡片：', targetCards.length);

  const batchSize = 3;
  let index = 0;

  function processBatch() {
    if (signal.aborted) return;
    const batch = targetCards.slice(index, index + batchSize);
    if (batch.length === 0) return;

    batch.forEach(card => {
      if (signal.aborted) return;
      let id = card.dataset.id;
      if (!id) {
        const href = card.dataset.href || '';
        const m = href.match(/\/detail\/(\d+)\.html/);
        if (m) id = m[1];
      }
      if (!id || enrichingSet.has(id)) {
        card.classList.add('enriched');
        return;
      }
      enrichingSet.add(id);

      const detailUrl = BASE + '/detail/' + id + '.html';
      // 使用带信号和更短超时的请求
      reqText(detailUrl, { signal: signal, timeout: 10 })
        .then(html => {
          if (signal.aborted) return;
          const doc = new DOMParser().parseFromString(html, 'text/html');
          let image = '';
          // 优先取背景图
          let bgEl = doc.querySelector('.vod-info-bg');
          if (bgEl) {
            const style = bgEl.getAttribute('style') || '';
            const match = style.match(/background-image:\s*url\(["']?(.*?)["']?\)/i);
            if (match) image = fixPic(match[1]);
          }
          if (!image) {
            const pic = doc.querySelector('.detail-pic img') || doc.querySelector('.vod-pic img') || doc.querySelector('.poster img');
            if (pic) {
              image = fixPic(pic.getAttribute('data-src') || pic.getAttribute('src') || '');
            }
          }
          if (image) {
            const poster = card.querySelector('.poster');
            if (poster) {
              const noimg = poster.querySelector('.noimg');
              if (noimg) noimg.remove();
              let imgEl = poster.querySelector('img');
              if (!imgEl) {
                imgEl = document.createElement('img');
                imgEl.loading = 'lazy';
                imgEl.referrerPolicy = 'no-referrer';
                poster.prepend(imgEl);
              }
              imgEl.src = imgUrl(image);
              imgEl.alt = card.querySelector('.name')?.textContent || '';
              imgEl.onerror = function() {
                this.dataset.failed = 'true';
                this.style.display = 'none';
                if (!this.parentNode.querySelector('.noimg')) {
                  const div = document.createElement('div');
                  div.className = 'noimg';
                  div.textContent = '枫';
                  this.parentNode.appendChild(div);
                }
              };
              console.log('[补图] 成功 ID:', id);
            }
          } else {
            console.warn('[补图] 无图 ID:', id);
          }
          card.classList.add('enriched');
        })
        .catch(err => {
          if (signal.aborted) return;
          console.warn('[补图] 请求失败 ID:', id, err.message);
          card.classList.add('enriched');
        });
    });

    index += batchSize;
    if (index < targetCards.length) {
      setTimeout(processBatch, 300);
    }
  }

  processBatch();
}

// 页面切换时取消补图并清理
function abortEnrich() {
  if (enrichAbortController) {
    enrichAbortController.abort();
    enrichAbortController = null;
  }
  enrichingSet.clear();
}

// ==================== 分页 ====================
function renderPager(totalItems) {
  const isPaged = pageState.url && (pageState.url.includes('/type/') || pageState.url.includes('/label/') || pageState.url.includes('/list/'));
  if (!isPaged || totalItems === 0) { pager.style.display = 'none'; pager.innerHTML = ''; return; }
  const perPage = 20;
  const isLast = totalItems < perPage || (totalItems < 15 && pageState.page > 1);
  pager.style.display = 'flex';
  pager.innerHTML = `
    <button id="prevPage" ${pageState.page <= 1 ? 'disabled' : ''}>上一页</button>
    <span>第 ${pageState.page} 页</span>
    <button id="nextPage" ${isLast ? 'disabled' : ''}>下一页</button>
  `;
  $('#prevPage').onclick = () => changePage(pageState.page - 1);
  $('#nextPage').onclick = () => changePage(pageState.page + 1);
}

async function changePage(page) {
  if (page < 1) return;
  let targetUrl = '';
  const url = pageState.url;
  if (url.includes('/list/')) {
    const listMatch = url.match(/\/list\/(\d+)/);
    if (listMatch) {
      const listId = listMatch[1];
      targetUrl = page === 1 ? BASE + '/list/' + listId + '-----------.html' : BASE + '/list/' + listId + '--------' + page + '---.html';
    }
  } else if (url.includes('/type/')) {
    const typeMatch = url.match(/\/type\/(\d+)/);
    if (typeMatch) {
      const typeId = typeMatch[1];
      targetUrl = page === 1 ? BASE + '/type/' + typeId + '.html' : BASE + '/type/' + typeId + '-' + page + '.html';
    }
  } else if (url.includes('/label/')) {
    const labelMatch = url.match(/\/label\/([^\/]+)/);
    if (labelMatch) {
      const labelName = labelMatch[1];
      targetUrl = page === 1 ? BASE + '/label/' + labelName + '/' : BASE + '/label/' + labelName + '/page/' + page + '.html';
    }
  }
  if (!targetUrl) return;
  console.log('[分页] 跳转 →', targetUrl);
  await loadPage(targetUrl, page);
}

// ==================== 页面加载 ====================
async function loadPage(url, page = 1) {
  // 取消之前的补图
  abortEnrich();

  currentUrl = abs(url);
  const listPageMatch = currentUrl.match(/\/list\/\d+--------(\d+)---\.html/);
  if (listPageMatch) page = parseInt(listPageMatch[1], 10);
  const typePageMatch = currentUrl.match(/\/type\/\d+-(\d+)\.html/);
  if (typePageMatch) page = parseInt(typePageMatch[1], 10);
  const labelPageMatch = currentUrl.match(/\/label\/[^\/]+\/page\/(\d+)\.html/);
  if (labelPageMatch) page = parseInt(labelPageMatch[1], 10);
  const isPaged = currentUrl.includes('/type/') || currentUrl.includes('/label/') || currentUrl.includes('/list/');
  if (isPaged) { pageState.url = currentUrl; pageState.page = page; } else { pageState.url = ''; pageState.page = 1; }

  renderTabs(currentUrl);
  content.innerHTML = '<div class="empty loading">正在加载内容…</div>';
  pager.style.display = 'none';
  try {
    const html = await reqText(currentUrl);
    lastHtmlContent = html;
    const sections = parseList(html);
    renderSections(sections);
    restoreFocus();
    if (!location.hash.startsWith('#search=') && !location.hash.startsWith('#detail=')) {
      history.pushState({ route: 'list', url: currentUrl, page }, '', '');
    }
  } catch(e) {
    content.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    pager.style.display = 'none';
    statusEl.textContent = '加载失败：' + e.message;
  }
}

// ==================== 搜索 ====================
async function search(q) {
  abortEnrich(); // 取消补图
  q = clean(q);
  if (!q) return;
  pageState.url = '';
  pageState.page = 1;
  renderTabs('');
  content.innerHTML = '<div class="empty loading">搜索中…</div>';
  pager.style.display = 'none';
  history.pushState({ route: 'search', q }, '', '#search=' + encodeURIComponent(q));
  let searchUrls = [BASE + '/search/-------------.html?wd=' + encodeURIComponent(q)];
  let html = null;
  for (let su of searchUrls) {
    try { html = await reqText(su); if (html && (html.includes('/detail/') || html.includes('class="grid"'))) break; } catch(e) {}
  }
  if (!html) { content.innerHTML = '<div class="empty">搜索失败，请换关键词或检查网络</div>'; statusEl.textContent = '搜索失败'; return; }
  lastHtmlContent = html;
  let sections = parseList(html, q);
  if (!sections.length || !sections[0].items.length) {
    content.innerHTML = '<div class="empty">没有找到相关结果</div>';
    statusEl.textContent = '无搜索结果：' + q;
    return;
  }
  renderSections(sections);
  statusEl.textContent = '搜索完成：' + q;
}

// ==================== 详情面板 ====================
async function openDetail(url) {
  lastFocus = document.activeElement;
  document.body.classList.add('detail-active');
  $('#detailSheet').classList.add('active');
  $('#detailPanel').innerHTML = '<div class="empty loading">正在读取详情…</div>';
  history.pushState({ route: 'detail', url }, '', '#detail=' + encodeURIComponent(url));
  try {
    const html = await reqText(url);
    const detail = parseDetail(html, url);
    let fieldsHtml = detail.fields.map(f => '<div><b>' + esc(f[0]) + '</b>：' + esc(f[1]) + '</div>').join('');
    if (!detail.lines || !detail.lines.length) detail.lines = [{ sid: '1', name: '默认线路', eps: [] }];
    let lineTabsHtml = detail.lines.map((ln, idx) =>
      '<button class="line-tab focusable ' + (idx === 0 ? 'active' : '') + '" data-sid="' + esc(ln.sid) + '">' + esc(ln.name) + '(' + ln.eps.length + ')</button>'
    ).join('');
    let panelHtml = `
      <button class="focusable" id="closeDetail">← 返回</button>
      <div class="detail-head">
        <img class="detail-pic" referrerpolicy="no-referrer" src="${esc(imgUrl(detail.image))}" onerror="this.style.display='none'">
        <div>
          <div class="detail-title">${esc(detail.title)}</div>
          <div class="detail-info">${fieldsHtml || '枫叶影院资源'}</div>
          <p class="desc">${esc(detail.desc)}</p>
        </div>
      </div>
      <h3>播放线路</h3>
      <div class="line-tabs">${lineTabsHtml}</div>
      <div class="episodes" id="episodeBox"></div>
    `;
    $('#detailPanel').innerHTML = panelHtml;
    $('#closeDetail').onclick = closeDetail;
    function renderLine(sid) {
      const box = $('#episodeBox');
      if (!detail.lines || detail.lines.length === 0) { box.innerHTML = '<div class="empty">暂无剧集</div>'; return; }
      let line = detail.lines.find(l => l.sid == sid) || detail.lines[0];
      if (!line || !line.eps || !line.eps.length) { box.innerHTML = '<div class="empty">该线路暂无剧集</div>'; return; }
      let epHtml = line.eps.map(ep => '<button class="ep focusable" data-href="' + esc(ep.href) + '">' + esc(ep.title) + '</button>').join('');
      box.innerHTML = epHtml;
      Array.from(box.querySelectorAll('.ep')).forEach(btn => {
        btn.onclick = () => playEpisode(btn.dataset.href, detail.title + ' ' + btn.textContent);
      });
      let firstEp = box.querySelector('.ep');
      if (firstEp) firstEp.focus({ preventScroll: true });
    }
    let lineTabs = $('#detailPanel').querySelectorAll('.line-tab');
    lineTabs.forEach(tab => {
      tab.onclick = () => { lineTabs.forEach(t => t.classList.remove('active')); tab.classList.add('active'); renderLine(tab.dataset.sid); };
    });
    renderLine(detail.lines[0]?.sid || '1');
    setTimeout(() => {
      if (!$('#episodeBox')?.querySelector('.ep')) {
        const closeBtn = $('#closeDetail');
        if (closeBtn) closeBtn.focus({ preventScroll: true });
      }
    }, 50);
  } catch(e) {
    $('#detailPanel').innerHTML = '<button class="focusable" id="closeDetail">← 返回</button><div class="empty">详情加载失败：' + esc(e.message) + '</div>';
    $('#closeDetail').onclick = closeDetail;
  }
}

function closeDetail() {
  document.body.classList.remove('detail-active');
  $('#detailSheet').classList.remove('active');
  if (location.hash.startsWith('#detail=')) history.back();
  if (lastFocus && typeof lastFocus.focus === 'function') {
    setTimeout(() => lastFocus.focus({ preventScroll: true }), 50);
  }
  lastFocus = null;
}
window.__fyClose = closeDetail;

function restoreFocus() {
  setTimeout(() => {
    let el = document.querySelector('.tab.active') || document.querySelector('.card');
    if (el && typeof el.focus === 'function') {
      el.focus({ preventScroll: true });
    }
  }, 30);
}

function handleKeys(e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' || e.key === 'Backspace') {
    if ($('#detailSheet').classList.contains('active')) { e.preventDefault(); closeDetail(); return; }
    if (e.key === 'Backspace') e.preventDefault();
    if (e.key === 'Escape' && currentUrl !== BASE + '/') loadPage(BASE + '/');
  }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('focusable') && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.activeElement.click();
  }
}

function handlePopState(e) {
  const hash = location.hash;
  if (hash.startsWith('#detail=')) {
    if ($('#detailSheet').classList.contains('active')) closeDetail();
  } else if (hash.startsWith('#search=')) {
    const q = decodeURIComponent(hash.replace('#search=', ''));
    if (q) {
      if (document.querySelector('.section-title h2')?.textContent !== '搜索：' + q) search(q);
    }
  } else {
    if (currentUrl) loadPage(currentUrl);
  }
}

// ==================== 播放 ====================
async function playEpisode(url, title) {
  statusEl.textContent = '正在破解至臻4K地址…';
  let realUrl = await crackPlayUrl(url);
  if (!realUrl) {
    statusEl.textContent = '破解失败，尝试普通嗅探…';
    realUrl = await fetchRealPlayUrl(url);
  }
  if (!realUrl) {
    statusEl.textContent = '❌ 未提取到播放地址，将打开原页面';
    realUrl = url;
  }
  if (window.fm && typeof fm.play === 'function') {
    fm.play(realUrl, title, { referer: BASE });
    statusEl.textContent = '✅ 已发送播放：' + title;
  } else {
    window.open(realUrl, '_blank');
  }
}

// ==================== 启动 ====================
function boot() {
  statusEl.textContent = '正在初始化…';
  renderTabs(BASE + '/');
  $('#searchForm').onsubmit = e => { e.preventDefault(); search($('#kw').value); };
  document.addEventListener('keydown', handleKeys, true);
  window.addEventListener('popstate', handlePopState);
  const hash = location.hash;
  if (hash.startsWith('#search=')) {
    const q = decodeURIComponent(hash.replace('#search=', ''));
    if (q) search(q);
  } else if (hash.startsWith('#detail=')) {
    const url = decodeURIComponent(hash.replace('#detail=', ''));
    if (url) openDetail(url);
  } else {
    loadPage(BASE + '/');
  }
}

waitFm().then(() => { try { boot(); } catch(e) { statusEl.textContent = '启动失败：' + e.message; } }).catch(() => boot());
})();
</script>
